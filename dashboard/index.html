  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --plane:#0d0d0d; --surface-1:#1a1a19;
    --text-primary:#ffffff; --text-secondary:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.10);
    --good:#0ca30c; --critical:#d03b3b;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
      }

  .topbar {
    position: sticky; top: 0; z-index: 20;
    background: var(--surface-1);
    border-bottom: 1px solid var(--border);
    backdrop-filter: saturate(1.4) blur(6px);
  }
  .topbar-inner {
    max-width: 1060px; margin: 0 auto;
    padding: 12px 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  }
  .topbar h1 { font-size: 18px; margin: 0; }
  .meta { margin-bottom: 18px; }
  .zero { color: var(--muted); }
  /* 토요일은 근무 형태가 달라 수치가 눈에 띄게 낮다. 한눈에 구분되게 표시한다. */
  tbody tr.sat td:first-child { color: var(--s1); font-weight: 600; }
  tbody tr.sat td { background: color-mix(in srgb, var(--s1) 6%, transparent); }
  tbody tr.hol td:first-child { color: var(--critical); font-weight: 600; }
  tbody tr.hol td { background: color-mix(in srgb, var(--critical) 6%, transparent); }
  td.sum, th.sum { border-left: 1px solid var(--axis); font-weight: 600; }

  body {
    background: var(--plane);
    color: var(--text-primary);
    font-family: var(--font-ui);
    line-height: 1.5;
    margin: 0;
    padding: 0 0 64px;
  }
  .wrap { max-width: 1060px; margin: 0 auto; padding: 20px 16px 0; }

  header { margin-bottom: 20px; }
  h1 { font-size: 22px; font-weight: 700; margin: 0 0 6px; letter-spacing: -0.015em; text-wrap: balance; }
  .sub { color: var(--text-secondary); font-size: 13px; margin: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip {
    font-size: 12px; padding: 3px 9px; border-radius: 999px;
    border: 1px solid var(--border); color: var(--text-secondary);
    background: var(--surface-1);
  }
  .chip.warn { color: var(--critical); border-color: color-mix(in srgb, var(--critical) 35%, transparent); }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 22px; }
  .kpi {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 16px;
  }
  .kpi .label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .kpi .value { font-size: 30px; font-weight: 600; letter-spacing: -0.02em; font-family: var(--font-num); }
  .kpi .value .unit { font-size: 14px; font-weight: 500; color: var(--text-secondary); margin-left: 3px; }
  .kpi .delta { font-size: 12px; margin-top: 3px; color: var(--text-secondary); }
  .kpi .delta.up { color: var(--good); }
  .kpi .delta.down { color: var(--critical); }

  .card {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px 18px 10px; margin-bottom: 18px;
  }
  .card h2 { font-size: 15px; font-weight: 600; margin: 0 0 2px; text-wrap: balance; }
  .card .note { font-size: 12px; color: var(--muted); margin: 0 0 12px; }

  .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg button {
    font: inherit; font-size: 13px; padding: 6px 14px; border: 0; cursor: pointer;
    background: var(--surface-1); color: var(--text-secondary);
  }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button[aria-pressed="true"] { background: var(--s1); color: #fff; }

  .legend { display: flex; flex-wrap: wrap; gap: 12px; margin: 0 0 10px; padding: 0; list-style: none; }
  .legend li { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); }
  .swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; }

  .plot { position: relative; overflow-x: auto; }
  svg { display: block; width: 100%; height: auto; overflow: visible; }
  .tick { fill: var(--muted); font-size: 11px; font-family: var(--font-num); }
  .gridline { stroke: var(--grid); stroke-width: 1; }
  .baseline { stroke: var(--axis); stroke-width: 1; }
  .dlabel { fill: var(--text-secondary); font-size: 11px; font-family: var(--font-num); font-weight: 500; }

  .tip {
    position: absolute; pointer-events: none; opacity: 0; transition: opacity .1s;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.14);
    min-width: 130px; z-index: 5;
  }
  .tip .t-head { font-weight: 600; margin-bottom: 5px; }
  .tip .t-row { display: flex; align-items: center; gap: 6px; justify-content: space-between; }
  .tip .t-row .nm { display: flex; align-items: center; gap: 5px; color: var(--text-secondary); }
  .tip .t-row .vl { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

  details { margin-top: 8px; }
  summary { font-size: 13px; color: var(--text-secondary); cursor: pointer; padding: 6px 0; }
  .tablewrap { overflow-x: auto; margin-top: 8px; max-height: 70vh; }
  thead th { position: sticky; top: 0; background: var(--surface-1); z-index: 1; }
  table { border-collapse: collapse; font-size: 12px; width: 100%; }
  th, td { padding: 5px 9px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--grid); }
  th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface-1); }
  thead th { color: var(--muted); font-weight: 600; }
  tbody tr.mrow td {
    background: var(--surface-2); cursor: pointer; user-select: none;
    font-weight: 600; text-align: left; color: var(--text);
    position: sticky; left: 0;
  }
  tbody tr.mrow td:hover { background: var(--surface-3, var(--surface-2)); }
  tbody tr.mrow .caret { color: var(--muted); margin-right: 6px; font-size: 10px; }
  tbody tr.mrow .q { color: var(--muted); font-weight: 400; margin-left: 6px; }
  thead th.open { cursor: pointer; color: var(--text-secondary); user-select: none; }
  thead th.open:hover { color: var(--text); }
  thead th.open .caret { color: var(--muted); font-size: 10px; margin-left: 3px; }
  th.sub, td.sub { background: var(--surface-2); }
  thead th.sub { font-weight: 500; }
  td.sub { color: var(--text-secondary); }
  tbody td { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
  tfoot td { font-weight: 500; font-family: var(--font-num); font-variant-numeric: tabular-nums; border-top: 1px solid var(--axis); }

  footer { color: var(--muted); font-size: 12px; margin-top: 26px; }

  :focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; border-radius: 4px; }
  @media (prefers-reduced-motion: reduce) { .tip { transition: none; } }
</style>

// 달이 쌓이면 표가 길어지므로 지난 달은 접어 둔다. null 이면 아직 정하지 않은 상태다.
let OPEN_MONTHS = null;
// 주차별에서는 목요일이 든 달로 센다. 6/29 시작 주가 6월로 잡히면 헷갈린다.
const monthOf = (b) => (GRAIN === "week" ? shiftDays(b.key, 3) : b.key).slice(0, 7);

// 월별 보기에서는 한 달이 이미 한 줄이라 묶을 것이 없다.
function monthGroups(agg) {
  if (GRAIN === "month") return null;
  const months = [...new Set(agg.buckets.map(monthOf))].sort();
  if (!OPEN_MONTHS) OPEN_MONTHS = new Set(months.slice(-1));   // 처음에는 이번 달만 편다
  for (const m of [...OPEN_MONTHS]) if (!months.includes(m)) OPEN_MONTHS.delete(m);
  if (!OPEN_MONTHS.size && months.length) OPEN_MONTHS.add(months[months.length - 1]);
  return months;
}
function openBuckets(agg) {
  const months = monthGroups(agg);
  return months ? agg.buckets.filter(b => OPEN_MONTHS.has(monthOf(b))) : agg.buckets;
}
const SERIES_VARS = ["--s1","--s2","--s3","--s4","--s5","--s6","--s7","--s8","--s9","--s10"];
const TOP_N = 9;   // + 그 외 = 10계열. 색으로 구분되는 상한이라 나머지는 묶는다.

const EMBEDDED = /*__DATA__*/null/*__END__*/;

let DATA = EMBEDDED || SAMPLE, IS_SAMPLE = !EMBEDDED, GRAIN = "day";

const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmt = (n) => n.toLocaleString("ko-KR");
const el = (id) => document.getElementById(id);

// ── 데이터 가공 ───────────────────────────────────────────────

// 상위 경로만 자기 색을 갖고 나머지는 "그 외"로 접는다.
// 색을 늘려서 계열을 늘리면 색맹 조건에서 구분이 무너지기 때문이다.
function channelOrder(rows) {
  const total = new Map();
  for (const r of rows) {
    const g = groupOf(r.channel);
    total.set(g, (total.get(g) || 0) + r.count);
  }
  const sorted = [...total.entries()].sort((a, b) => b[1] - a[1]).map(([c]) => c);
  const top = sorted.slice(0, TOP_N);
  return { top, hasFold: sorted.length > TOP_N };
}

// 공휴일. 인입이 평일의 1/3 수준이라 평균과 증감 비교에서 빼야 한다.
// 2026-07-17 · 08-15 · 08-17 은 받은 데이터에서 확인됐다. 나머지는 해마다 확인이 필요하다.
const HOLIDAYS = new Set([
  "2026-01-01",
  "2026-02-16", "2026-02-17", "2026-02-18",              // 설날
  "2026-03-01", "2026-03-02",                            // 삼일절 · 대체
  "2026-05-05", "2026-05-24", "2026-05-25",              // 어린이날 · 부처님오신날 · 대체
  "2026-06-06",                                          // 현충일
  "2026-07-17",                                          // 제헌절
  "2026-08-15", "2026-08-17",                            // 광복절 · 대체
  "2026-09-24", "2026-09-25", "2026-09-26", "2026-09-28",// 추석 · 대체
  "2026-10-03", "2026-10-05", "2026-10-09",              // 개천절 · 대체 · 한글날
  "2026-12-25",
]);

const dowOf = (iso) => new Date(iso + "T00:00:00Z").getUTCDay();
const isSaturday = (iso) => dowOf(iso) === 6;
const isRest = (iso) => dowOf(iso) === 0 || dowOf(iso) === 6 || HOLIDAYS.has(iso);
// 색은 토요일이 먼저다. 토요일이면서 공휴일인 날도 파랑으로 둔다.
const toneOf = (iso) => dowOf(iso) === 6 ? "sat"
                      : (dowOf(iso) === 0 || HOLIDAYS.has(iso)) ? "hol" : "";
const restWhy = (iso) => {
  const h = HOLIDAYS.has(iso), d = dowOf(iso);
  if (d === 6) return h ? "토요일 · 공휴일" : "토요일";
  if (d === 0) return h ? "일요일 · 공휴일" : "일요일";
  return h ? "공휴일" : "";
};

const shiftDays = (iso, n) =>
  new Date(new Date(iso + "T00:00:00Z").getTime() + n * 86400000).toISOString().slice(0, 10);
const weekStart = (iso) => shiftDays(iso, -((dowOf(iso) + 6) % 7));   // 월요일 시작
const md = (iso) => `${+iso.slice(5, 7)}/${+iso.slice(8, 10)}`;

function bucketKey(iso, grain) {
  const d = new Date(iso + "T00:00:00");
  if (grain === "month") return iso.slice(0, 7);
  if (grain === "week") {
    const day = (d.getDay() + 6) % 7;                 // 월요일 시작
    const mon = new Date(d); mon.setDate(d.getDate() - day);
    return mon.toISOString().slice(0, 10);
  }
  return iso;
}

function bucketLabel(key, grain) {
  if (grain === "month") return `${+key.slice(5, 7)}월`;
  const d = new Date(key + "T00:00:00");
  if (grain === "week") return `${d.getMonth() + 1}/${d.getDate()} 주`;
  return `${d.getMonth() + 1}/${d.getDate()}`;
}

function aggregate() {
  const { top, hasFold } = channelOrder(DATA.rows);
  const names = hasFold ? [...top, FOLD] : [...top];      // 차트용 - 색으로 구분되는 수만
  const map = new Map();
  const allTotals = new Map();

  for (const r of DATA.rows) {
    const g = groupOf(r.channel);
    const k = bucketKey(r.date, GRAIN);
    if (!map.has(k)) map.set(k, { parts: Object.fromEntries(names.map(n => [n, 0])), all: {}, sub: {}, work: 0 });
    const b = map.get(k);
    b.parts[top.includes(g) ? g : FOLD] += r.count;
    b.all[g] = (b.all[g] || 0) + r.count;
    const dk = detailKeyOf(r.channel);
    b.sub[dk] = (b.sub[dk] || 0) + r.count;
    if (!isRest(r.date)) b.work = (b.work || 0) + r.count;
    allTotals.set(g, (allTotals.get(g) || 0) + r.count);
  }

  const keys = [...map.keys()].sort();
  const buckets = keys.map(k => {
    const b = map.get(k);
    return {
      key: k, label: bucketLabel(k, GRAIN), parts: b.parts, all: b.all, sub: b.sub, work: b.work || 0,
      rest: GRAIN === "day" && isRest(k),
      tone: GRAIN === "day" ? toneOf(k) : "",
      why: GRAIN === "day" ? restWhy(k) : "",
      total: names.reduce((s, n) => s + b.parts[n], 0),
    };
  });

  // 표에는 모든 채널을 건수 순으로 싣는다. 색이 모자란 것은 차트에서만 문제다.
  const allNames = [...allTotals.entries()].sort((a, b) => b[1] - a[1]).map(([n]) => n);

  const totals = names.map(n => ({ name: n, value: buckets.reduce((s, b) => s + b.parts[n], 0) }))
                      .sort((a, b) => b.value - a.value);

  // 표에서 채널 이름을 누르면 코드별로 펼치므로, 묶음마다 세부 목록을 미리 만든다.
  const detail = new Map();
  for (const r of DATA.rows) {
    const g = groupOf(r.channel);
    if (!detail.has(g)) detail.set(g, new Map());
    const m = detail.get(g);
    const key = detailKeyOf(r.channel);
    m.set(key, (m.get(key) || 0) + r.count);
  }
  for (const [k, m] of detail)
    detail.set(k, [...m.entries()].map(([name, value]) => ({ name, value })).sort((a, b) => b.value - a.value));

  return { names, allNames, buckets, totals, detail };
}

const colorOf = (names) => {
  const m = new Map();
  names.forEach((n, i) => m.set(n, cssVar(SERIES_VARS[Math.min(i, SERIES_VARS.length - 1)])));
  return m;
};

// ── 그리기 도우미 ────────────────────────────────────────────

const NS = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs = {}) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  return e;
}

// 데이터 끝만 둥글게. 기준선 쪽은 각지게 붙여 둔다.
function barPath(x, y, w, h, r, round) {
  if (h <= 0) return "";
  const rr = Math.min(r, h, w / 2);
  if (!round || rr <= 0) return `M${x},${y}h${w}v${h}h${-w}Z`;
  return `M${x},${y + rr}a${rr},${rr} 0 0 1 ${rr},${-rr}h${w - 2 * rr}a${rr},${rr} 0 0 1 ${rr},${rr}v${h - rr}h${-w}Z`;
}
function barPathH(x, y, w, h, r) {
  if (w <= 0) return "";
  const rr = Math.min(r, w, h / 2);
  if (rr <= 0) return `M${x},${y}h${w}v${h}h${-w}Z`;
  return `M${x},${y}h${w - rr}a${rr},${rr} 0 0 1 ${rr},${rr}v${h - 2 * rr}a${rr},${rr} 0 0 1 ${-rr},${rr}h${-(w - rr)}Z`;
}

function niceTicks(max, count = 4) {
  if (max <= 0) return [0, 1];
  const raw = max / count;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw) || mag * 10;
  const top = Math.ceil(max / step) * step;          // 최댓값을 반드시 덮는 눈금까지
  const out = [];
  for (let v = 0; v <= top + step * 0.001; v += step) out.push(Math.round(v));
  return out;
}

function showTip(tip, host, x, y, html) {
  tip.innerHTML = html;
  tip.style.opacity = "1";
  const hw = host.clientWidth;
  const tw = tip.offsetWidth;
  tip.style.left = Math.max(0, Math.min(hw - tw, x - tw / 2)) + "px";
  tip.style.top = Math.max(0, y) + "px";
}
const hideTip = (tip) => { tip.style.opacity = "0"; };
</script>

<script>
// ── 추이 (단일 계열, 강조형) ──────────────────────────────────
function drawTrend(agg) {
  const host = el("plot-trend"), tip = el("tip-trend");
  host.querySelectorAll("svg").forEach(n => n.remove());

  const W = Math.max(host.clientWidth, 320), H = 260;
  const m = { t: 14, r: 16, b: 30, l: 44 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  // 토·일·공휴일은 인입이 평일의 1/3 수준이라 섞으면 추세가 톱니처럼 보인다.
  // 일자별에서는 그 날을 아예 빼고, 주·월별에서는 합계에서 뺀 값을 쓴다.
  const pts = agg.buckets.filter(b => !(GRAIN === "day" && b.rest))
                         .map(b => ({ ...b, total: b.work }));
  if (!pts.length) return;

  const max = Math.max(...pts.map(b => b.total), 1);
  const ticks = niceTicks(max);
  const top = ticks[ticks.length - 1];
  const X = (i) => m.l + (pts.length === 1 ? iw / 2 : (i / (pts.length - 1)) * iw);
  const Y = (v) => m.t + ih - (v / top) * ih;

  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, role: "img",
    "aria-label": `기간별 전체 DB 수량 추이, 최대 ${max}건` });

  for (const t of ticks) {
    svg.appendChild(svgEl("line", { class: t === 0 ? "baseline" : "gridline",
      x1: m.l, x2: m.l + iw, y1: Y(t), y2: Y(t) }));
    const lb = svgEl("text", { class: "tick", x: m.l - 8, y: Y(t) + 4, "text-anchor": "end" });
    lb.textContent = fmt(t); svg.appendChild(lb);
  }

  const step = Math.ceil(pts.length / Math.max(3, Math.floor(iw / 58)));
  pts.forEach((b, i) => {
    if (i % step && i !== pts.length - 1) return;
    const lb = svgEl("text", { class: "tick", x: X(i), y: H - 10, "text-anchor": "middle" });
    lb.textContent = b.label; svg.appendChild(lb);
  });

  const line = pts.map((b, i) => `${i ? "L" : "M"}${X(i)},${Y(b.total)}`).join("");
  svg.appendChild(svgEl("path", {
    d: `${line}L${X(pts.length - 1)},${Y(0)}L${X(0)},${Y(0)}Z`,
    fill: cssVar("--s1"), "fill-opacity": ".10", stroke: "none" }));
  svg.appendChild(svgEl("path", { d: line, fill: "none",
    stroke: cssVar("--s1"), "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));

  const last = pts.length - 1;
  svg.appendChild(svgEl("circle", { cx: X(last), cy: Y(pts[last].total), r: 4.5,
    fill: cssVar("--s1"), stroke: cssVar("--surface-1"), "stroke-width": 2 }));
  const dl = svgEl("text", { class: "dlabel", x: X(last), y: Y(pts[last].total) - 12, "text-anchor": "end" });
  dl.textContent = fmt(pts[last].total) + "건"; svg.appendChild(dl);

  const cross = svgEl("line", { class: "gridline", y1: m.t, y2: m.t + ih, opacity: 0,
    stroke: cssVar("--axis"), "stroke-width": 1 });
  const dot = svgEl("circle", { r: 5, fill: cssVar("--s1"),
    stroke: cssVar("--surface-1"), "stroke-width": 2, opacity: 0 });
  svg.appendChild(cross); svg.appendChild(dot);

  const hit = svgEl("rect", { x: m.l, y: m.t, width: iw, height: ih, fill: "transparent" });
  hit.addEventListener("mousemove", (ev) => {
    const r = svg.getBoundingClientRect();
    const px = (ev.clientX - r.left) * (W / r.width);
    let i = 0, best = Infinity;
    pts.forEach((_, k) => { const d = Math.abs(X(k) - px); if (d < best) { best = d; i = k; } });
    const b = pts[i];
    cross.setAttribute("x1", X(i)); cross.setAttribute("x2", X(i)); cross.setAttribute("opacity", 1);
    dot.setAttribute("cx", X(i)); dot.setAttribute("cy", Y(b.total)); dot.setAttribute("opacity", 1);
    showTip(tip, host, X(i) * (r.width / W), Y(b.total) * (r.height / H) - 52,
      `<div class="t-head">${b.label}</div>
       <div class="t-row"><span class="nm">전체</span><span class="vl">${fmt(b.total)}건</span></div>`);
  });
  hit.addEventListener("mouseleave", () => {
    cross.setAttribute("opacity", 0); dot.setAttribute("opacity", 0); hideTip(tip);
  });
  svg.appendChild(hit);
  host.appendChild(svg);
}

// ── 경로별 구성 (가로 누적 막대) ────────────────────────
// 표와 같은 방향으로 읽히도록 기간을 세로로 세운다. 기간이 늘어도 이름이 겹치지 않는다.
function drawStack(agg) {
  const host = el("plot-stack"), tip = el("tip-stack");
  host.querySelectorAll("svg").forEach(n => n.remove());

  const pts = openBuckets(agg);
  if (!pts.length) return;

  const colors = colorOf(agg.names);
  const W = Math.max(host.clientWidth, 320);
  const rowH = 28, m = { t: 26, r: 58, b: 8, l: 62 };
  const H = m.t + m.b + pts.length * rowH;
  const iw = W - m.l - m.r;
  const max = Math.max(...pts.map(b => b.total), 1);
  const ticks = niceTicks(max);
  const top = ticks[ticks.length - 1];
  const X = (v) => m.l + (v / top) * iw;

  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, role: "img",
    "aria-label": "기간별 유입경로 구성 가로 누적 막대" });

  for (const v of ticks) {
    svg.appendChild(svgEl("line", { class: v === 0 ? "baseline" : "gridline",
      x1: X(v), x2: X(v), y1: m.t - 6, y2: m.t + pts.length * rowH }));
    const lb = svgEl("text", { class: "tick", x: X(v), y: m.t - 12, "text-anchor": "middle" });
    lb.textContent = fmt(v); svg.appendChild(lb);
  }

  pts.forEach((b, i) => {
    const y = m.t + i * rowH + 5;
    const h = rowH - 12;

    const lb = svgEl("text", { class: "tick", x: m.l - 10, y: y + h / 2 + 4, "text-anchor": "end" });
    lb.textContent = b.label;
    if (b.tone) {
      lb.setAttribute("fill", cssVar(b.tone === "sat" ? "--s1" : "--critical"));
      lb.setAttribute("font-weight", "600");
    }
    svg.appendChild(lb);

    // 왼쪽부터 쌓고, 조각 사이에 2px 면색 간격을 둬 경계를 분리한다.
    let acc = 0;
    const stack = agg.names.filter(n => b.parts[n] > 0);
    stack.forEach((n, k) => {
      const v = b.parts[n];
      const x0 = X(acc), x1 = X(acc + v);
      const gap = k < stack.length - 1 ? 2 : 0;
      const w = Math.max(0, x1 - x0 - gap);
      const isEnd = k === stack.length - 1;
      const path = svgEl("path", {
        d: isEnd ? barPathH(x0, y, w, h, 4) : `M${x0},${y}h${w}v${h}h${-w}Z`,
        fill: colors.get(n) });
      path.addEventListener("mousemove", () => {
        const r = svg.getBoundingClientRect();
        const rows = stack.slice().reverse().map(x =>
          `<div class="t-row"><span class="nm"><span class="swatch" style="background:${colors.get(x)}"></span>${x}</span><span class="vl">${fmt(b.parts[x])}</span></div>`).join("");
        showTip(tip, host, x1 * (r.width / W), (y * (r.height / H)) - 16,
          `<div class="t-head">${b.label} · 합계 ${fmt(b.total)}건</div>${rows}`);
      });
      path.addEventListener("mouseleave", () => hideTip(tip));
      svg.appendChild(path);
      acc += v;
    });

    const vl = svgEl("text", { class: "dlabel", x: X(b.total) + 8, y: y + h / 2 + 4 });
    vl.textContent = fmt(b.total); svg.appendChild(vl);
  });

  host.appendChild(svg);
}

</script>

<script>
function drawKpis(agg) {
  const days = [...new Set(DATA.rows.map(r => r.date))].sort();
  const byDay = new Map(days.map(d => [d, 0]));
  for (const r of DATA.rows) byDay.set(r.date, byDay.get(r.date) + r.count);

  const lastDay = days[days.length - 1];
  const lastVal = byDay.get(lastDay) || 0;

  const sumRange = (from, to) => days.filter(d => d >= from && d <= to)
                                     .reduce((s, d) => s + byDay.get(d), 0);
  const hasRange = (from, to) => days.some(d => d >= from && d <= to);

  // 비교 기준일. 토·일·공휴일은 인입이 평일의 1/3 수준이라 기준이 되지 못하므로
  // 영업일이 나올 때까지 하루씩 거슬러 올라간다. 최신일 자체가 쉬는 날이면
  // 평일과 견줄 수 없으니 같은 요일인 한 주 전과 견준다.
  function prevWorkday(from) {
    let cur = from;
    for (let i = 0; i < 40; i++) {
      cur = shiftDays(cur, -1);
      if (!isRest(cur) && byDay.has(cur)) return cur;
    }
    return null;
  }
  const lastIsRest = isRest(lastDay);
  const baseDay = lastIsRest
    ? (byDay.has(shiftDays(lastDay, -7)) ? shiftDays(lastDay, -7) : null)
    : prevWorkday(lastDay);
  const baseName = lastIsRest ? `전주 같은 요일` : "전영업일";

  // 주·월은 같은 길이의 앞 구간과 견준다. 요일 구성이 같아야 늘고 준 것이 보인다.
  const wFrom = weekStart(lastDay);
  const wCur = sumRange(wFrom, lastDay);
  const wpFrom = shiftDays(wFrom, -7), wpTo = shiftDays(lastDay, -7);
  const wPrev = hasRange(wpFrom, wpTo) ? sumRange(wpFrom, wpTo) : null;

  const [yy, mm, dd] = lastDay.split("-").map(Number);
  const pad = (n) => String(n).padStart(2, "0");
  const mFrom = `${lastDay.slice(0, 7)}-01`;
  const mCur = sumRange(mFrom, lastDay);
  const pmY = mm === 1 ? yy - 1 : yy, pmM = mm === 1 ? 12 : mm - 1;
  const pmEndDay = Math.min(dd, new Date(Date.UTC(pmY, pmM, 0)).getUTCDate());
  const pmFrom = `${pmY}-${pad(pmM)}-01`, pmTo = `${pmY}-${pad(pmM)}-${pad(pmEndDay)}`;
  const mPrev = hasRange(pmFrom, pmTo) ? sumRange(pmFrom, pmTo) : null;

  // 평균은 이번 달 영업일만 센다. 토·일·공휴일을 섞으면 평일 수준이 실제보다 낮게 보이고,
  // 지난달까지 함께 평균 내면 이번 달이 어떤지가 묻힌다.
  const workDays = days.filter(d => d >= mFrom && d <= lastDay && !isRest(d));
  const workSum = workDays.reduce((s, d) => s + byDay.get(d), 0);
  const avg = workDays.length ? Math.round(workSum / workDays.length) : 0;

  const grand = agg.totals.reduce((s, t) => s + t.value, 0);
  const topCh = agg.totals.find(t => t.name !== FOLD) || agg.totals[0];
  const share = grand ? Math.round((topCh.value / grand) * 100) : 0;

  const delta = (cur, prev, label) => {
    if (prev == null) return `<div class="delta">비교할 ${label} 없음</div>`;
    const d = cur - prev;
    const cls = d > 0 ? "up" : d < 0 ? "down" : "";
    const mark = d > 0 ? "▲" : d < 0 ? "▼" : "─";
    return `<div class="delta ${cls}">${label} 대비 ${mark} ${fmt(Math.abs(d))}건</div>`;
  };

  el("kpis").innerHTML = `
    <div class="kpi">
      <div class="label">${md(lastDay)} (최신)${lastIsRest ? ` · ${restWhy(lastDay)}` : ""}</div>
      <div class="value">${fmt(lastVal)}<span class="unit">건</span></div>
      ${delta(lastVal, baseDay ? byDay.get(baseDay) : null, baseDay ? `${baseName}(${md(baseDay)})` : "기준일")}
    </div>
    <div class="kpi">
      <div class="label">이번 주 (${md(wFrom)}~${md(lastDay)})</div>
      <div class="value">${fmt(wCur)}<span class="unit">건</span></div>
      ${delta(wCur, wPrev, `전주 같은 구간(${md(wpFrom)}~${md(wpTo)})`)}
    </div>
    <div class="kpi">
      <div class="label">이번 달 (${mm}/1~${md(lastDay)})</div>
      <div class="value">${fmt(mCur)}<span class="unit">건</span></div>
      ${delta(mCur, mPrev, `전월 같은 구간(${pmM}/1~${pmM}/${pmEndDay})`)}
    </div>
    <div class="kpi">
      <div class="label">${mm}월 영업일 평균</div>
      <div class="value">${fmt(avg)}<span class="unit">건</span></div>
      <div class="delta">영업일 ${workDays.length}일 · 토·일·공휴일 제외</div>
    </div>
    <div class="kpi">
      <div class="label">최다 유입경로</div>
      <div class="value" style="font-size:20px">${topCh.name}</div>
      <div class="delta">${fmt(topCh.value)}건 · 전체의 ${share}%</div>
    </div>`;
}
function drawLegend(agg) {
  const colors = colorOf(agg.names);
  el("legend-stack").innerHTML = agg.names.map(n =>
    `<li><span class="swatch" style="background:${colors.get(n)}"></span>${n}</li>`).join("");
}

function drawTable(agg) {
  const grain = GRAIN === "day" ? "날짜" : GRAIN === "week" ? "주차" : "월";

  // 펼친 채널은 그 자리를 코드별 열로 바꾼다. 코드가 하나뿐이면 펼칠 게 없다.
  const cols = [];
  for (const n of agg.allNames) {
    const subs = (agg.detail.get(n) || []).filter(s => s.value > 0);
    const openable = subs.length > 1;
    const open = openable && EXPANDED.has(n);
    cols.push({ key: n, label: n, openable, open });
    if (open) for (const s of subs) cols.push({ key: s.name, label: s.name, isSub: true });
  }

  const cell = (b, c) => c.isSub ? (b.sub[c.key] || 0) : (b.all[c.key] || 0);
  // 합계는 묶음 기준으로만 센다. 펼친 열까지 더하면 두 번 세어진다.
  const rowTotal = (b) => agg.allNames.reduce((s, n) => s + (b.all[n] || 0), 0);

  const head = `<tr><th>${grain}</th><th class="sum">합계</th>` + cols.map(c => {
    if (c.isSub) return `<th class="sub">${c.label}</th>`;
    if (!c.openable) return `<th>${c.label}</th>`;
    return `<th class="open" role="button" tabindex="0" aria-expanded="${c.open}"` +
           ` data-ch="${c.key.replace(/"/g, "&quot;")}" title="눌러서 코드별로 보기">` +
           `${c.label}<span class="caret">${c.open ? "▾" : "▸"}</span></th>`;
  }).join("") + `</tr>`;

  const rowHtml = (b) =>
    `<tr${b.tone ? ` class="${b.tone}"` : ""}><td${b.why ? ` title="${b.why}"` : ""}>${b.label}</td>` +
    `<td class="sum">${fmt(rowTotal(b))}</td>` +
    cols.map(c => {
      const v = cell(b, c);
      return `<td${c.isSub ? ' class="sub"' : ""}>${v ? fmt(v) : '<span class="zero">–</span>'}</td>`;
    }).join("") + `</tr>`;

  const months = monthGroups(agg);
  const unit = GRAIN === "week" ? "주" : "일";
  const body = !months
    ? agg.buckets.map(rowHtml).join("")
    : months.map(m => {
        const rows = agg.buckets.filter(b => monthOf(b) === m);
        const open = OPEN_MONTHS.has(m);
        const sum = rows.reduce((s, b) => s + rowTotal(b), 0);
        return `<tr class="mrow"><td colspan="${cols.length + 2}" role="button" tabindex="0"` +
               ` data-m="${m}" aria-expanded="${open}">` +
               `<span class="caret">${open ? "▾" : "▸"}</span>${+m.slice(5)}월` +
               ` <span class="q">${rows.length}${unit} · ${fmt(sum)}건</span></td></tr>` +
               (open ? rows.map(rowHtml).join("") : "");
      }).join("");

  const foot = `<tr><td>합계</td>` +
    `<td class="sum">${fmt(agg.buckets.reduce((s, b) => s + rowTotal(b), 0))}</td>` +
    cols.map(c => {
      const v = agg.buckets.reduce((s, b) => s + cell(b, c), 0);
      return `<td${c.isSub ? ' class="sub"' : ""}>${fmt(v)}</td>`;
    }).join("") + `</tr>`;

  el("tablewrap").innerHTML = `<table><thead>${head}</thead><tbody>${body}</tbody><tfoot>${foot}</tfoot></table>`;

  el("tablewrap").querySelectorAll("td[data-m]").forEach(td => {
    const m = td.dataset.m;
    const toggle = () => {
      OPEN_MONTHS.has(m) ? OPEN_MONTHS.delete(m) : OPEN_MONTHS.add(m);
      if (!OPEN_MONTHS.size) OPEN_MONTHS.add(m);      // 전부 접으면 볼 것이 없다
      render();
    };
    td.addEventListener("click", toggle);
    td.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); toggle(); }
    });
  });

  el("tablewrap").querySelectorAll("th.open").forEach(th => {
    const name = th.dataset.ch;
    const toggle = () => {
      EXPANDED.has(name) ? EXPANDED.delete(name) : EXPANDED.add(name);
      const left = el("tablewrap").scrollLeft;
      drawTable(agg);
      el("tablewrap").scrollLeft = left;      // 펼쳐도 보던 자리를 지킨다
    };
    th.addEventListener("click", toggle);
    th.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); toggle(); }
    });
  });
}
function render() {
  const agg = aggregate();
  drawKpis(agg);
  drawLegend(agg);
  drawTrend(agg);
  drawStack(agg);
  drawTable(agg);

  const days = [...new Set(DATA.rows.map(r => r.date))].sort();
  const grand = DATA.rows.reduce((s, r) => s + r.count, 0);
  el("sub").textContent =
    `${days[0]} ~ ${days[days.length - 1]} · ${days.length}일 · 누계 ${fmt(grand)}건` +
    ` · 마지막 갱신 ${(DATA.generated || "").replace("T", " ").slice(0, 16)}`;
  const ex = DATA.excluded || [];
  el("chip-excl").textContent = !ex.length ? "제외 항목 없음"
    : ex.length <= 3 ? `${ex.join(", ")} 제외`
    : `${ex.slice(0, 2).join(", ")} 외 ${ex.length - 2}개 제외`;
  el("chip-excl").title = ex.length ? ex.join(", ") : "";
  el("chip-src").textContent = IS_SAMPLE ? "샘플 데이터" : "실제 수집 데이터";
  el("chip-src").classList.toggle("warn", IS_SAMPLE);
  const restDays = days.filter(isRest).length;
  el("note-trend").textContent = restDays
    ? `영업일만 표시합니다. 토·일·공휴일 ${restDays}일은 뺐습니다.`
    : "전체 등록 건수";

  el("foot").textContent = IS_SAMPLE
    ? "지금 보이는 숫자는 화면 구성을 확인하기 위한 샘플입니다."
    : "CRM4 통합고객목록에서 수집한 데이터입니다. 협력점해피콜은 제외했습니다.";
}

document.querySelectorAll(".seg button").forEach(btn => {
  btn.addEventListener("click", () => {
    GRAIN = btn.dataset.grain;
    document.querySelectorAll(".seg button").forEach(b =>
      b.setAttribute("aria-pressed", String(b === btn)));
    render();
  });
});

let resizeTimer;
addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(render, 120);
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => setTimeout(render, 60));

// 데이터가 파일 안에 박혀 있으면 그대로 그린다. 없을 때만(=미리보기) 옆의 data.json 을 찾아본다.
if (EMBEDDED) {
  render();
} else {
  fetch("./data.json", { cache: "no-store" })
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(j => { if (j && Array.isArray(j.rows) && j.rows.length) { DATA = j; IS_SAMPLE = false; } })
    .catch(() => {})
    .finally(render);
}
</script>
